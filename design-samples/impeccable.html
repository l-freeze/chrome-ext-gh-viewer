<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts Console</title>
<!--
  Sample for: pbakaus/impeccable (v4.8, Operate mode)
  Scene: a developer doing a periodic storage clean-up at their desk, in a long-ish focused session -> light by default, dark equally designed.
  Color strategy: Restrained neutrals tinted toward harbor blue + a committed shell band (impeccable: "a grey screen with one accent is
  the category default"). Accent only for primary action, selection and state. Semantic states standardized.
  Type: system UI stack (Operate permission), one family, 1.125 scale: 12 / 13 / 14.5 / 16 / 18. Mono only for artifact identifiers (data).
  Signature move: the selection-aware storage meter in the shell — selected bytes light up inside the total, so the cost of the action is
  visible before you act. Everything else is standard: tabs, chips, sortable headers, checkboxes.
  Craft floor: inline confirmation instead of a modal, skeleton rows for repos still loading, empty/disabled/expired states,
  themed selection, scrollbars, caret and checkboxes. No eyebrows, no side-stripe borders, no gradient text.
-->
<style>
:root{
  --shell:#1F3547; --shell-2:#2A4459; --on-shell:#EEF3F7; --on-shell-muted:#AFC0CD;
  --ground:#F3F5F7; --surface:#FFFFFF; --surface-2:#F7F9FA; --hover:#EEF2F5;
  --line:#DCE2E7; --line-soft:#E9EDF0;
  --text:#18232C; --muted:#56636E; --faint:#6F7B85;
  --accent:#1D64A8; --accent-hover:#17548E; --accent-soft:#E3EEF8; --on-accent:#FFFFFF;
  --sel:#EAF2FB; --sel-line:#9EC1E6;
  --danger:#B42318; --danger-soft:#FDECEA; --on-danger:#FFFFFF;
  --warn:#8A5300; --warn-soft:#FDF3E1;
  --ok:#1E6E43; --ok-soft:#E3F4EA;
  --skel:#E7ECEF; --skel-2:#F1F4F6;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --shell:#16293A; --on-shell:#E3EAF0; --on-shell-muted:#91A3B1;
    --ground:#10161B; --surface:#161D23; --surface-2:#1A2229; --hover:#1E2830;
    --line:#2A353E; --line-soft:#222C34;
    --text:#E2E8ED; --muted:#9AA8B3; --faint:#7F8D98;
    --accent:#6AAEEB; --accent-hover:#8BC1F0; --accent-soft:#1A2E40; --on-accent:#0B1620;
    --sel:#172A3B; --sel-line:#33587A;
    --danger:#F2776C; --danger-soft:#3A1D1B; --on-danger:#1C0A08;
    --warn:#E6B05C; --warn-soft:#332714;
    --ok:#6CCB97; --ok-soft:#173023;
    --skel:#222C34; --skel-2:#1B242B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --shell:#16293A; --on-shell:#E3EAF0; --on-shell-muted:#91A3B1;
  --ground:#10161B; --surface:#161D23; --surface-2:#1A2229; --hover:#1E2830;
  --line:#2A353E; --line-soft:#222C34;
  --text:#E2E8ED; --muted:#9AA8B3; --faint:#7F8D98;
  --accent:#6AAEEB; --accent-hover:#8BC1F0; --accent-soft:#1A2E40; --on-accent:#0B1620;
  --sel:#172A3B; --sel-line:#33587A;
  --danger:#F2776C; --danger-soft:#3A1D1B; --on-danger:#1C0A08;
  --warn:#E6B05C; --warn-soft:#332714;
  --ok:#6CCB97; --ok-soft:#173023;
  --skel:#222C34; --skel-2:#1B242B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:400 13px/1.45 var(--ui);font-variant-numeric:tabular-nums}
::selection{background:var(--sel-line);color:var(--text)}
input,button,select{font:inherit;color:inherit;caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
*{scrollbar-color:var(--line) transparent;scrollbar-width:thin}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}

/* Shell band */
.shell{background:var(--shell);color:var(--on-shell);padding-inline:20px}
.bar{display:flex;align-items:center;gap:20px;height:48px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px}
.mark svg{display:block}
.tabs{display:flex;gap:2px;height:100%}
.tab{appearance:none;border:0;background:none;color:var(--on-shell-muted);padding:0 12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--on-shell)}
.tab[aria-selected="true"]{color:var(--on-shell);border-bottom-color:var(--on-shell)}
.tab .c{font-size:12px;opacity:.8}
.meter{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--on-shell-muted);min-width:0}
.meter b{color:var(--on-shell);font-weight:600}
.meter .track{width:180px;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;display:flex}
.meter .track .s{background:#F6B44B}
.meter .track .r{background:rgba(255,255,255,.45)}
.settings{appearance:none;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-shell);border-radius:6px;height:28px;padding:0 10px;cursor:pointer}
.owners{display:flex;gap:6px;align-items:center;padding-block:8px 10px;flex-wrap:wrap}
.owners .lbl{color:var(--on-shell-muted);font-size:12px;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 4px;border-radius:14px;border:1px solid rgba(255,255,255,.2);color:var(--on-shell);cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.chip .av.org{border-radius:5px}
.chip .n{color:var(--on-shell-muted);font-size:12px}
.chip.on{background:var(--on-shell);color:var(--shell);border-color:var(--on-shell)}
.chip.on .n{color:var(--shell);opacity:.7}
.chip:focus-within{outline:2px solid #F6B44B;outline-offset:1px}
.progress{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--on-shell-muted);font-size:12px}
.progress .t{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.progress .t i{display:block;height:100%;width:90%;background:var(--on-shell)}

/* Work area */
.work{padding:16px 20px 32px;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;color:var(--muted)}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp input,.inp select{border:0;outline:0;background:transparent;height:28px;color:var(--text)}
.inp input[type=number]{width:44px}
.inp.search{width:260px}
.inp.search input{width:100%}
.summary{margin-left:auto;color:var(--muted)}
.summary b{color:var(--text);font-weight:600}

/* Bulk bar sits where the toolbar is when selection exists */
.bulk{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 12px;background:var(--sel);border:1px solid var(--sel-line);border-radius:8px}
.bulk .what{font-weight:600}
.bulk .what span{font-weight:400;color:var(--muted)}
.btn{appearance:none;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:var(--on-danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.bulk .note{color:var(--muted);font-size:12px}
.bulk .right{margin-left:auto;display:flex;gap:6px}
.bulk.confirm{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.bulk.confirm .what{color:var(--danger)}

/* Table */
.table{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100dvh - 210px)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:940px}
th,td{height:34px;padding:0 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
thead th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line)}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th .arr{display:inline-block;width:10px;color:var(--accent)}
th[aria-sort] {color:var(--text)}
.num{text-align:right}
td.c,th.c{width:34px;padding-right:0}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--sel)}
.art{font-family:var(--mono);font-size:12.5px}
.repo{color:var(--muted)}
.repo b{color:var(--text);font-weight:500}
.br{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.dim{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.exp{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{color:var(--muted);padding:0}
tr.expired td{color:var(--faint)}
tr.expired .art{text-decoration:line-through;text-decoration-color:var(--faint)}
.rowbtn{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:4px;border-radius:4px;display:inline-grid;place-items:center}
.rowbtn:hover{background:var(--accent-soft)}
.rowbtn[disabled]{color:var(--faint);cursor:not-allowed;background:none}
.sk td{border-bottom-color:var(--line-soft)}
.sk i{display:block;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--skel),var(--skel-2),var(--skel));background-size:200% 100%;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.loadrow td{color:var(--muted);font-size:12px;height:30px;background:var(--surface-2)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}

.theme{position:fixed;right:12px;bottom:12px;font-size:12px}
@media (max-width:820px){.bar{flex-wrap:wrap;height:auto;padding-block:8px;row-gap:4px}.tabs{height:40px}.meter{order:3;width:100%;margin-left:0}.settings{margin-left:auto}.progress{margin-left:0;width:100%}.meter .track{width:90px}.bulk{height:auto;flex-wrap:wrap;padding:8px}.bulk .right{margin-left:0;flex-wrap:wrap}.inp.search{width:100%}.summary{margin-left:0;width:100%}.shell,.work{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){.sk i{animation:none}}
</style>
</head>
<body>
<header class="shell">
  <div class="bar">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5 10 3l7 3.5v7L10 17l-7-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 6.5 10 10l7-3.5M10 10v7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Artifacts Console
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" aria-selected="true">Artifacts <span class="c" id="tabN"></span></button>
      <button class="tab" role="tab" aria-selected="false">Issues <span class="c">38</span></button>
    </nav>
    <div class="meter" aria-live="polite">
      <span id="meterText"></span>
      <div class="track" aria-hidden="true"><div class="s" id="mSel"></div><div class="r" id="mRest"></div></div>
    </div>
    <button class="settings">Settings</button>
  </div>
  <div class="owners" role="group" aria-label="Owners to include">
    <span class="lbl">Owners</span>
    <span id="ownerChips" style="display:contents"></span>
    <div class="progress" role="status"><span>Loading 5 more repositories</span><div class="t"><i></i></div><span>47 / 52</span></div>
  </div>
</header>

<main class="work">
  <div id="bar"></div>

  <div class="table">
    <table>
      <thead><tr>
        <th class="c"><input type="checkbox" id="all" aria-label="Select all visible"></th>
        <th>Artifact</th>
        <th>Repository</th>
        <th>Branch</th>
        <th class="num sortable">Size <span class="arr"></span></th>
        <th class="sortable" aria-sort="descending">Created <span class="arr">↓</span></th>
        <th class="sortable">Expires <span class="arr"></span></th>
        <th class="num" aria-label="Actions"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="foot"><span id="footL"></span><span>Retention is set per repository (default 90 days).</span></div>
</main>
<button class="btn theme" id="theme">Light / dark</button>

<script>
const TODAY = new Date("2026-10-30T12:00:00Z");
const OWNERS = [
  {login:"sora-builds", org:false, hue:"#4C6FB5", on:true},
  {login:"acme-labs", org:true, hue:"#2F7D6B", on:true},
  {login:"my-sideprojects", org:true, hue:"#A0602A", on:true},
];
const ROWS = [
  {repo:"acme-labs/web-console", name:"playwright-report", mb:148.6, created:"2026-10-29", expires:"2027-01-27", branch:"main"},
  {repo:"acme-labs/web-console", name:"dist-bundle", mb:23.4, created:"2026-10-28", expires:"2027-01-26", branch:"feat/billing-page"},
  {repo:"acme-labs/web-console", name:"coverage-lcov", mb:6.1, created:"2026-08-02", expires:"2026-10-31", branch:"main"},
  {repo:"acme-labs/data-pipeline", name:"parquet-sample-export", mb:412.8, created:"2026-09-14", expires:"2026-12-13", branch:"main", sel:true},
  {repo:"acme-labs/data-pipeline", name:"dbt-docs-site", mb:18.9, created:"2026-07-21", expires:"2026-10-19", branch:"release/2.4", expired:true},
  {repo:"acme-labs/data-pipeline", name:"test-results-junit", mb:1.2, created:"2026-10-30", expires:"2027-01-28", branch:"fix/null-partition"},
  {repo:"acme-labs/mobile-app", name:"android-release-apk", mb:96.3, created:"2026-10-21", expires:"2027-01-19", branch:"release/5.2.0"},
  {repo:"acme-labs/mobile-app", name:"ios-simulator-build", mb:311.5, created:"2026-07-30", expires:"2026-10-28", branch:"main", expired:true},
  {repo:"acme-labs/mobile-app", name:"detox-screenshots", mb:54.0, created:"2026-10-03", expires:"2027-01-01", branch:"main"},
  {repo:"my-sideprojects/tile-game", name:"webgl-build", mb:72.2, created:"2026-10-12", expires:"2026-11-11", branch:"main"},
  {repo:"my-sideprojects/tile-game", name:"wasm-profile-trace", mb:8.7, created:"2026-09-01", expires:"2026-10-01", branch:"perf/atlas-packing", expired:true},
  {repo:"sora-builds/dotfiles", name:"nix-closure-cache", mb:204.0, created:"2026-08-20", expires:"2026-11-18", branch:"main", sel:true},
];
let confirming = false;
const day = s => new Date(s+"T12:00:00Z");
const dd = (a,b) => Math.round((b-a)/864e5);
const mb = v => v>=1000 ? (v/1000).toFixed(2)+" GB" : v.toFixed(1)+" MB";
const md = s => day(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year: s.startsWith("2027")?"numeric":undefined, timeZone:"UTC"});
const ICON_DL = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8m0 0L4.8 7.3M8 10.5l3.2-3.2M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_TR = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render(){
  const chips = document.getElementById("ownerChips"); chips.innerHTML="";
  OWNERS.forEach(o=>{
    const n = ROWS.filter(r=>r.repo.startsWith(o.login+"/")).length;
    const l = document.createElement("label");
    l.className = "chip"+(o.on?" on":"");
    l.innerHTML = `<input type="checkbox" ${o.on?"checked":""}><span class="av ${o.org?"org":""}" style="background:${o.hue}">${o.login[0].toUpperCase()}</span>${o.login}<span class="n">${n}</span>`;
    l.querySelector("input").onchange = e=>{o.on=e.target.checked; render();};
    chips.appendChild(l);
  });
  const vis = ROWS.filter(r=>OWNERS.find(o=>r.repo.startsWith(o.login+"/")).on);
  const live = vis.filter(r=>!r.expired);
  const total = live.reduce((s,r)=>s+r.mb,0);
  const sel = vis.filter(r=>r.sel);
  const selMB = sel.reduce((s,r)=>s+r.mb,0);
  document.getElementById("tabN").textContent = vis.length;
  document.getElementById("meterText").innerHTML = sel.length
    ? `<b>${mb(selMB)}</b> of ${mb(total)} selected`
    : `<b>${mb(total)}</b> stored in artifacts`;
  document.getElementById("mSel").style.width = (total? selMB/total*100:0)+"%";
  document.getElementById("mRest").style.width = (total? (total-selMB)/total*100:0)+"%";

  const bar = document.getElementById("bar");
  if (!sel.length){
    bar.innerHTML = `<div class="toolbar">
      <label class="inp search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input placeholder="Filter repositories" aria-label="Filter repositories"></label>
      <label class="inp">Older than <input type="number" value="30"> days</label>
      <label class="inp">Size ≥ <input type="number" value="10"> MB</label>
      <label class="inp"><select aria-label="Expired state"><option>All states</option><option>Active</option><option>Expired</option></select></label>
      <span class="summary"><b>${vis.length}</b> artifacts in <b>${new Set(vis.map(r=>r.repo)).size}</b> repositories · <b>${mb(total)}</b></span></div>`;
  } else if (!confirming){
    bar.innerHTML = `<div class="bulk" role="region" aria-label="Selection">
      <span class="what">${sel.length} selected <span>· ${mb(selMB)}</span></span>
      <span class="note">from ${new Set(sel.map(r=>r.repo)).size} repositories</span>
      <div class="right">
        <button class="btn primary">${ICON_DL} Download ${sel.length}</button>
        <button class="btn danger" id="del">${ICON_TR} Delete ${sel.length}</button>
        <button class="btn ghost" id="clr">Clear selection</button>
      </div></div>`;
    bar.querySelector("#del").onclick = ()=>{confirming=true; render(); document.getElementById("yes").focus();};
    bar.querySelector("#clr").onclick = ()=>{ROWS.forEach(r=>r.sel=false); render();};
  } else {
    bar.innerHTML = `<div class="bulk confirm" role="alertdialog" aria-label="Confirm deletion">
      <span class="what">Delete ${sel.length} artifacts (${mb(selMB)})?</span>
      <span class="note">They are removed from GitHub for everyone. This cannot be undone.</span>
      <div class="right">
        <button class="btn danger solid" id="yes">Delete ${sel.length} artifacts</button>
        <button class="btn" id="no">Keep them</button>
      </div></div>`;
    bar.querySelector("#no").onclick = ()=>{confirming=false; render();};
    bar.querySelector("#yes").onclick = ()=>{confirming=false; render();};
  }

  const tb = document.getElementById("rows"); tb.innerHTML="";
  vis.slice().sort((a,b)=>day(b.created)-day(a.created)).forEach(r=>{
    const left = dd(TODAY, day(r.expires));
    const exp = r.expired ? `<span class="pill exp">Expired ${md(r.expires)}</span>`
      : left<=3 ? `<span class="pill soon">Tomorrow</span>`
      : `<span class="pill ok">${md(r.expires)} <span class="dim">· ${left} d</span></span>`;
    const [o,n] = r.repo.split("/");
    const tr = document.createElement("tr");
    tr.className = (r.sel?"sel ":"")+(r.expired?"expired":"");
    tr.innerHTML = `<td class="c"><input type="checkbox" ${r.sel?"checked":""} ${r.expired?"disabled":""} aria-label="Select ${r.name}"></td>
      <td class="art">${r.name}</td>
      <td class="repo">${o}/<b>${n}</b></td>
      <td><span class="br">${r.branch}</span></td>
      <td class="num">${mb(r.mb)}</td>
      <td>${md(r.created)}</td>
      <td>${exp}</td>
      <td class="num"><button class="rowbtn" ${r.expired?"disabled":""} aria-label="Download ${r.name}" title="${r.expired?"Expired artifacts can't be downloaded":"Download"}">${ICON_DL}</button></td>`;
    tr.querySelector("input").onchange = e=>{r.sel=e.target.checked; confirming=false; render();};
    tb.appendChild(tr);
  });
  tb.insertAdjacentHTML("beforeend", `<tr class="loadrow"><td></td><td colspan="7">Still loading acme-labs/infra-terraform, acme-labs/design-tokens and 3 more…</td></tr>`
    + [1,2].map(()=>`<tr class="sk"><td></td><td><i style="width:140px"></i></td><td><i style="width:170px"></i></td><td><i style="width:60px"></i></td><td><i style="width:56px;margin-left:auto"></i></td><td><i style="width:50px"></i></td><td><i style="width:64px"></i></td><td></td></tr>`).join(""));
  document.getElementById("all").checked = live.length && live.every(r=>r.sel);
  document.getElementById("all").indeterminate = sel.length>0 && sel.length<live.length;
  document.getElementById("footL").textContent = `${vis.length} artifacts · ${vis.length-live.length} expired (not counted in storage)`;
}
document.getElementById("all").onchange = e=>{ROWS.forEach(r=>{if(!r.expired) r.sel=e.target.checked}); render();};
document.getElementById("theme").onclick = () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
render();
</script>
</body>
</html>
