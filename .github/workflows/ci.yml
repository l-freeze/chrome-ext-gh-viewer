name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip

  # master のビルドを Release「master-build」に置く。
  # Actions のアーティファクトはアカウントの保存容量を使うので使わない（Release の添付ファイルは容量に数えられない）
  release:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: master-build
    env:
      TAG: master-build
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zip
      - name: Publish chrome-extension.zip to the master-build pre-release
        run: |
          cp .output/*-chrome.zip chrome-extension.zip
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          notes="master の最新ビルド（${GITHUB_SHA::7}）。Chrome への入れ方は README の「手動インストール」を参照してください。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --notes "$notes"
          else
            gh release create "$TAG" --prerelease --title "master build" --notes "$notes"
          fi
          gh release upload "$TAG" chrome-extension.zip --clobber
